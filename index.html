<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NG Nailart — Studio Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Cormorant+Garamond:ital,wght@0,400;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--cream:#FFF7EF;--white:#FFFFFF;--ink:#111111;--muted:#6f6a66;--line:#e9e0d6;--soft:#f6ece2}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:110px}
body{background:var(--cream);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;font-weight:300;font-size:14px;line-height:1.7;letter-spacing:.02em;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:0 22px}
.preview-bar{background:var(--ink);color:var(--cream);text-align:center;font-size:10px;letter-spacing:.25em;padding:6px 10px;text-transform:uppercase}
header{position:sticky;top:0;z-index:20;background:rgba(255,247,239,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;height:58px}
.top img{height:34px}
.top-right{display:flex;gap:8px;align-items:center}
.lang{display:flex;border:1px solid var(--ink);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;font:500 10px Montserrat,sans-serif;letter-spacing:.18em;padding:6px 10px;cursor:pointer;color:var(--ink)}
.lang button.on{background:var(--ink);color:var(--cream)}
.btn{font:500 10px Montserrat,sans-serif;letter-spacing:.22em;text-transform:uppercase;border:1px solid var(--ink);background:var(--ink);color:var(--cream);padding:8px 14px;border-radius:999px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
nav.chips{display:flex;gap:6px;overflow-x:auto;padding:0 22px 10px;max-width:560px;margin:0 auto;scrollbar-width:none}
nav.chips::-webkit-scrollbar{display:none}
nav.chips button{flex:none;cursor:pointer;font:400 10px Montserrat,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--white);padding:6px 12px;border-radius:999px}
section{padding:40px 0 10px;display:none}
section.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
nav.chips button.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.welcome{font-weight:300;font-style:italic;font-size:22px;letter-spacing:.12em;text-align:center;margin-top:4px}
.seg{display:flex;gap:6px;overflow-x:auto;margin-top:22px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;font:400 10px Montserrat,sans-serif;letter-spacing:.18em;text-transform:uppercase;border:1px solid var(--line);background:var(--white);color:var(--ink);padding:7px 12px;border-radius:999px;cursor:pointer;position:relative}
.seg button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dot{position:absolute;top:3px;right:5px;width:6px;height:6px;border-radius:50%;background:#b0566a}
.hello{display:flex;justify-content:space-between;align-items:center;gap:10px}.hello .btn{white-space:nowrap;flex:none}
.hello h2{text-align:left;font-size:14px}
.st.done{background:var(--ink);color:var(--cream)}
.st.done.gift{background:#b0566a;border-color:#b0566a}
.st.gift:not(.done){background:transparent;color:var(--ink);border-style:dashed}
.progress{text-align:center;margin-top:16px;font-size:12px}
.appt{border-bottom:1px solid var(--line);padding:16px 0}
.appt:last-child{border:0}
.appt .hd{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.15em;text-transform:uppercase}
.appt .hd span:last-child{color:var(--muted)}
.appt .tot{font-weight:500;border-top:1px solid var(--ink);margin-top:6px;padding-top:8px}
.disc .p{color:#b0566a}
.coupon{border:1px solid var(--ink);border-radius:16px;padding:20px;margin-top:16px;position:relative;background:var(--white)}
.coupon:before,.coupon:after{content:"";position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--cream);border:1px solid var(--ink);transform:translateY(-50%)}
.coupon:before{left:-10px;clip-path:inset(0 0 0 50%)}
.coupon:after{right:-10px;clip-path:inset(0 50% 0 0)}
.coupon.used{opacity:.45}
.coupon .big{font-size:20px;letter-spacing:.2em;font-weight:400;text-align:center;margin:8px 0}
.code{text-align:center;font-weight:500;letter-spacing:.3em;border:1px dashed var(--ink);border-radius:10px;padding:8px;margin-top:10px}
.status{position:absolute;top:14px;right:16px;font-size:8px;letter-spacing:.25em;text-transform:uppercase;border:1px solid currentColor;border-radius:999px;padding:2px 8px}
.letter{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.letter:last-child{border:0}
.env{width:44px;height:32px;flex:none;border:1px solid var(--ink);position:relative;background:var(--white)}
.env:before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom right,transparent 49%,var(--ink) 50%,transparent 51%),linear-gradient(to bottom left,transparent 49%,var(--ink) 50%,transparent 51%);background-size:50% 60%;background-repeat:no-repeat;background-position:left top,right top}
.env.unread{background:var(--soft)}
.letter b{font-weight:500;display:block;font-size:12px;letter-spacing:.08em}
.letter small{color:var(--muted);font-size:11px}
.paper{background:var(--white);border:1px solid var(--line);border-radius:6px;padding:26px 22px;margin-top:16px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.05)}
textarea{width:100%;font:300 14px Montserrat,sans-serif;letter-spacing:.03em;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--cream);min-height:110px;resize:vertical}
select{width:100%;font:400 14px Montserrat,sans-serif;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--cream);color:var(--ink)}
#acct .card input:not([type=checkbox]):not([type=radio]){width:100%;font:300 14px Montserrat,sans-serif;letter-spacing:.03em;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--cream);color:var(--ink);-webkit-appearance:none;appearance:none;min-height:46px}
#acct .card input:disabled{opacity:.6}
.field{display:block;font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:12px}
.chk input{margin-top:4px;accent-color:var(--ink)}
.info{font-size:11px;background:var(--soft);border-radius:12px;padding:10px 12px;margin-top:12px;color:var(--ink)}
.login-wrap{min-height:60vh;display:flex;flex-direction:column;justify-content:center}
.login-wrap input{width:100%;font:400 15px Montserrat,sans-serif;letter-spacing:.1em;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--white)}
.login-wrap .btn{width:100%;margin-top:22px;padding:13px}
.linkcard{display:flex;align-items:center;gap:16px;text-decoration:none;color:var(--ink)}
.linkcard>div{flex:1}
.linkcard small{display:block;font-size:11px;color:var(--muted)}
.arr{font-size:18px;font-weight:300}
.link{background:none;border:0;font:400 11px Montserrat,sans-serif;letter-spacing:.12em;color:var(--muted);text-decoration:underline;cursor:pointer;margin-top:14px}
h1{font-weight:300;font-size:26px;letter-spacing:.38em;text-transform:uppercase;text-align:center;line-height:1.4}
h2{font-weight:400;font-size:17px;letter-spacing:.38em;text-transform:uppercase;text-align:center}
.sub{text-align:center;font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.lead{text-align:center;color:var(--muted);margin:16px auto 0;max-width:420px}
h3{font-weight:600;font-size:11px;letter-spacing:.3em;text-transform:uppercase;margin:26px 0 10px}
.card{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:22px 20px;margin-top:22px}
.hero{text-align:center;padding-top:40px}
.hero img{width:130px;margin-bottom:22px}
.wifi{display:grid;gap:12px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:10px}
.kv:last-child{border:0;padding:0}
.k{font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--muted)}
.v{font-weight:500;letter-spacing:.08em}
.copy{font:500 9px Montserrat,sans-serif;letter-spacing:.2em;text-transform:uppercase;border:1px solid var(--ink);background:none;border-radius:999px;padding:5px 10px;cursor:pointer;color:var(--ink)}
.announce{border-left:2px solid var(--ink);border-radius:4px 18px 18px 4px}
.tag{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;border:1px solid var(--ink);border-radius:999px;overflow:hidden;margin:24px auto 0;max-width:320px}
.tabs button{flex:1;background:none;border:0;font:500 10px Montserrat,sans-serif;letter-spacing:.22em;text-transform:uppercase;padding:10px 6px;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--ink);color:var(--cream)}
.row{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px dotted var(--line)}
.row:last-child{border:0}
.row .n{letter-spacing:.1em}
.row .n i{font-size:11px;color:var(--muted)}
.row .p{white-space:nowrap;font-weight:400;letter-spacing:.08em;text-align:right}
.fav{font-size:8px;letter-spacing:.25em;color:#8a8fbf;font-style:italic;margin-left:4px;vertical-align:super}
.note{font-size:11px;font-style:italic;color:var(--muted);margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{font-weight:600;font-size:9px;letter-spacing:.2em;text-transform:uppercase;text-align:right;padding:6px 4px;border-bottom:1px solid var(--ink)}
th:first-child,td:first-child{text-align:left}
td{padding:8px 4px;border-bottom:1px dotted var(--line);text-align:right;white-space:nowrap}
td:first-child{white-space:normal;letter-spacing:.06em}
td small{display:block;font-size:10px;color:var(--muted);font-style:italic}
.unit{font-size:10px;color:var(--muted);text-align:right;margin-top:6px;font-style:italic}
.quote{font-style:italic;color:var(--muted);text-align:center;margin-top:14px}
.svc{padding:0;overflow:hidden}
.svchead{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:18px 20px;text-transform:none;letter-spacing:.02em;font-weight:300;font-size:14px}
.svchead:after{content:none!important}
.svchead .short{text-align:left!important;letter-spacing:.02em}
.svchead::-webkit-details-marker{display:none}
.svchead>div{flex:1;text-align:left}
.svchead h4{text-align:left!important}
.svchead .for{text-align:left!important}
.svchead .short{font-size:12px;color:var(--muted);margin-top:6px}
.svchead .plus{font-size:20px;font-weight:300}
details.svc[open] .plus{transform:rotate(45deg)}
.intro{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:22px 20px;margin-top:22px;text-align:left}
.intro ul{list-style:none;margin:12px 0 16px}
.intro li{padding:6px 0 6px 26px;position:relative;font-size:13px}
.intro li span{position:absolute;left:0}
.intro li b{font-weight:400}
.chatpost{border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px;background:var(--white)}
.bubble{border-radius:14px;padding:10px 12px;font-size:13px;margin-top:8px;position:relative}
.bubble.me{background:var(--soft);margin-left:28px}
.bubble.them{background:var(--cream);border:1px solid var(--line);margin-right:28px}
.bubble small{display:block;font-size:10px;color:var(--muted);letter-spacing:.08em;margin-bottom:3px}
.heart{background:none;border:0;cursor:pointer;font-size:13px;color:var(--muted);padding:2px 0;margin-top:4px}
.heart.on{color:#b0566a}
.svc img{width:100%;display:block}
.svc .in{padding:20px}
.svc h4{font-weight:400;font-size:15px;letter-spacing:.3em;text-transform:uppercase;text-align:center}
.svc .for{font-style:italic;font-size:11px;text-align:center;color:var(--muted);letter-spacing:.15em}
.svc p{margin-top:12px;text-align:center}
.svc .ex{font-style:italic;color:var(--muted);font-size:13px}
.inc{font-size:11px;letter-spacing:.08em;text-align:center;margin-top:14px;color:var(--ink)}
.dur{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:16px}
.dur div{background:var(--soft);border-radius:12px;padding:8px 4px;text-align:center}
.dur b{display:block;font-weight:500;font-size:12px}
.dur span{font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.meta{font-size:11px;text-align:center;margin-top:12px;color:var(--muted)}
.lcard{border-radius:16px;overflow:hidden;border:1px solid var(--line);margin-top:18px}
.lc-l{background:var(--white);padding:20px 18px;text-align:center}
.lc-l p{font-size:10px;letter-spacing:.24em;text-transform:uppercase;line-height:1.8}
.lc-name{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:26px;margin:6px 0 10px;min-height:30px}
.lc-l img{width:44px}
.lc-r{background:#EDE1D8;padding:18px}
.lc-g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.lc-c{aspect-ratio:1;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px}
.lc-c span{font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;color:#8a8380}
.lc-c small{font-size:8px;letter-spacing:.12em;text-transform:uppercase;line-height:1.5}
.lc-c b{font-weight:400;font-size:16px}
.lc-d{background:var(--ink);color:var(--cream)}
.lc-d span{color:var(--cream)}
.lc-ten{display:flex;align-items:center;gap:12px;margin-top:12px;justify-content:center}
.lc-ten>span{font-size:10px;letter-spacing:.2em;text-transform:uppercase}
.lc-s{width:48px;flex:none;padding:0}
.lc-s span{font-size:18px}
.ach li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dotted var(--line);list-style:none;font-size:11px;letter-spacing:.12em;text-transform:uppercase;line-height:1.5}
.ach li:last-child{border:0}
.ach .bx{width:22px;height:22px;border:1.5px solid var(--ink);border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px}
.ach .bx.on{background:var(--ink);color:var(--cream)}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:20px}
.st{aspect-ratio:1;border:1px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;position:relative}
.st.gift{background:var(--ink);color:var(--cream)}
.tiers{margin-top:20px}
.tiers .row .n b{font-weight:500}
ul.list{list-style:none;margin-top:6px}
ul.list li{padding:9px 0 9px 22px;border-bottom:1px dotted var(--line);position:relative}
ul.list li:last-child{border:0}
ul.list li:before{content:"";position:absolute;left:4px;top:18px;width:8px;height:1px;background:var(--ink)}
ul.list li b{font-weight:500}
details{border-top:1px solid var(--line)}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:16px 0;font-weight:500;font-size:11px;letter-spacing:.28em;text-transform:uppercase;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";font-weight:300;font-size:16px;line-height:1}
details[open] summary:after{content:"–"}
.dd{padding-bottom:16px}
.dd h5{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-top:8px}
ol.book{list-style:none;counter-reset:b}
ol.book li{counter-increment:b;padding:10px 0 10px 34px;position:relative;border-bottom:1px dotted var(--line)}
ol.book li:last-child{border:0}
ol.book li:before{content:counter(b);position:absolute;left:0;top:10px;width:22px;height:22px;border:1px solid var(--ink);border-radius:50%;font-size:10px;display:flex;align-items:center;justify-content:center}
.bank{background:var(--soft);border-radius:14px;padding:14px;margin-top:8px}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.sw{text-decoration:none;color:var(--ink);aspect-ratio:1;border-radius:14px;border:1px solid var(--line);display:flex;align-items:flex-end;padding:6px;font-size:9px;letter-spacing:.12em}
.sw span{background:rgba(255,255,255,.85);border-radius:999px;padding:1px 7px}
footer{text-align:center;padding:50px 0 40px;margin-top:40px;border-top:1px solid var(--ink)}
footer a{color:var(--ink);font-size:11px;letter-spacing:.3em;text-decoration:none;text-transform:uppercase}
.modal{position:fixed;inset:0;background:rgba(17,17,17,.4);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.on{display:flex}
.sheet{background:var(--cream);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:30px 24px 34px}
.sheet label{display:block;font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.sheet input{width:100%;font:400 15px Montserrat,sans-serif;letter-spacing:.1em;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--white)}
.sheet .btn{width:100%;margin-top:22px;padding:13px}
.rulebanner{display:flex;align-items:center;gap:16px;background:var(--ink);color:var(--cream);border-radius:18px;padding:20px;margin-top:22px;text-align:left;cursor:pointer}
.rulebanner .nofood{width:58px;height:58px;flex:none}
.rulebanner b{display:block;font-weight:500;font-size:13px;letter-spacing:.22em;text-transform:uppercase;line-height:1.5}
.rulebanner span{display:block;font-size:12px;opacity:.85;margin-top:4px}
.bigrule{text-align:center;border:1.5px solid var(--ink);border-radius:20px;padding:26px 20px;margin-top:22px;background:var(--white)}
.bigrule .nofood{width:84px;height:84px}
.bigrule h3{font-size:15px;letter-spacing:.28em;margin:14px 0 6px}
.rlist li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px dotted var(--line);list-style:none}
.rlist li:last-child{border:0}
.rlist .ic{flex:none;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:15px}
.rlist .no{border:1px solid var(--ink)}
.rlist .yes{background:var(--soft)}
.lovenote{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:26px 22px 20px;margin-top:18px;position:relative}
.lovenote:before{content:"\201C";position:absolute;top:-6px;left:18px;font-size:64px;line-height:1;color:var(--line);font-family:Georgia,serif}
.lovenote .body{font-style:italic;font-size:15px;line-height:1.75;position:relative}
.lovenote .who{margin-top:14px;font-size:10px;letter-spacing:.28em;text-transform:uppercase}
.lovenote .rep{margin-top:12px;border-top:1px dotted var(--line);padding-top:10px;font-size:12px;color:var(--muted)}
.lovenote .rep b{font-weight:500;color:var(--ink)}
.setbanner{display:flex;gap:12px;align-items:center;background:var(--ink);color:var(--cream);border-radius:16px;padding:14px 16px;margin-top:16px;cursor:pointer}
.setbanner b{font-weight:500;letter-spacing:.06em}
.setbanner small{display:block;font-size:11px;opacity:.8;margin-top:2px}
.story{--paper:#faf8f4;--wall:#e7e3de;--pin:#e2a6ad;--ink2:#1b1b1b;--faint:#8a8580;width:100%;max-width:360px;aspect-ratio:9/16;margin:16px auto 0;background:var(--wall);display:flex;align-items:center;justify-content:center;border-radius:6px;overflow:hidden}
.rcp{width:72%;background:var(--paper);color:var(--ink2);font-size:9.5px;letter-spacing:.06em;padding:26px 16px 26px;position:relative;transform:rotate(-1deg);box-shadow:0 1px 1px rgba(0,0,0,.04),6px 14px 24px rgba(0,0,0,.10);
 clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),96% 100%,91% calc(100% - 6px),86% 100%,80% calc(100% - 8px),74% 100%,69% calc(100% - 5px),63% 100%,57% calc(100% - 7px),51% 100%,45% calc(100% - 5px),39% 100%,33% calc(100% - 8px),27% 100%,21% calc(100% - 5px),15% 100%,9% calc(100% - 7px),4% 100%,0 calc(100% - 6px))}
.rcp.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.rcp.sans{font-family:Montserrat,sans-serif;font-weight:300;letter-spacing:.12em;font-size:9px}
.rcp .pinx{position:absolute;top:7px;left:50%;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8,var(--pin) 55%);z-index:1}
.rcp .pinsh{position:absolute;top:9px;left:50%;width:18px;height:18px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle,rgba(0,0,0,.16) 0,rgba(0,0,0,.07) 45%,rgba(0,0,0,0) 70%)}
.rcp .br{text-align:center;letter-spacing:.32em;font-size:10.5px;margin-top:4px}
.rcp .ds{text-align:center;color:var(--faint);letter-spacing:0;overflow:hidden;white-space:nowrap;font-size:9px;margin:3px 0;opacity:.85}
.rcp .tt{text-align:center;font-size:10.5px;letter-spacing:.14em}
.rcp .ph{display:grid;gap:3px;margin:6px 0}
.rcp .ph .pc{overflow:hidden;clip-path:inset(0);position:relative;background:#eee;min-height:0}.rcp .ph img{width:100%;height:100%;object-fit:cover;display:block}
.rcp .g1{aspect-ratio:4/4.4}.rcp .g2{grid-template-columns:1fr 1fr;aspect-ratio:4/3.3}.rcp .g3{grid-template-columns:1.3fr 1fr;grid-template-rows:1fr 1fr;aspect-ratio:4/3.6}.rcp .g3 .pc:first-child{grid-row:1/3}
.rcp .it{display:flex;justify-content:space-between;gap:8px;padding:1.5px 0;line-height:1.5}
.rcp .it span:last-child{white-space:nowrap}
.rcp .bg{font-size:11px;font-weight:500}
.rcp .sm{text-align:center;line-height:1.6;margin-top:5px}
.rcp .fx{color:var(--faint);font-size:8.5px}
.rcp .bar{height:20px;margin:9px 14px 3px;background:repeating-linear-gradient(90deg,var(--ink2) 0 2px,transparent 2px 4px,var(--ink2) 4px 5px,transparent 5px 8px,var(--ink2) 8px 11px,transparent 11px 13px);opacity:.85}
.rcp [contenteditable]{outline:none}
.rcp [contenteditable]:focus{background:rgba(0,0,0,.05)}
.swx{display:flex;gap:10px;flex-wrap:wrap}
.cropov{position:fixed;inset:0;background:rgba(20,18,17,.55);z-index:99;display:flex;align-items:center;justify-content:center;padding:20px}.cropbox{background:var(--white);border-radius:18px;padding:18px;width:100%;max-width:380px}.cropfr{width:100%;overflow:hidden;border-radius:8px;margin:10px auto 0;touch-action:none;cursor:grab;background:#eee;position:relative}.cropfr img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;user-select:none;-webkit-user-select:none}.cropz{width:100%;accent-color:var(--ink)}
.achst{display:block;text-transform:none;letter-spacing:.02em;font-size:10.5px;color:var(--muted);margin-top:3px}.achst u{cursor:pointer}.achf{display:flex;gap:6px;margin-top:8px;text-transform:none;letter-spacing:0}.achf input{flex:1;min-width:0;font:400 12px Montserrat,sans-serif;padding:8px 10px;border:1px solid var(--line);border-radius:10px}.achf .btn{padding:8px 14px}
.bkpick{display:flex;flex-direction:column;gap:8px;margin-top:10px}.bkopt{text-align:left;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:13px 15px;font:400 13px Montserrat,sans-serif;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:3px}.bkopt b{font-weight:500;letter-spacing:.1em;text-transform:uppercase;font-size:12px}.bkopt small{font-size:11px;color:var(--muted)}.bkopt.sm{padding:10px 13px;font-size:12.5px}.bkopt.on{border-color:var(--ink);background:var(--ink);color:var(--cream)}.bkopt.on small{color:#d9d2cb}
.bkdays{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}.bkday{flex:none;border:1px solid var(--line);background:var(--white);border-radius:12px;padding:9px 12px;font:400 11px Montserrat,sans-serif;letter-spacing:.06em;cursor:pointer;color:var(--ink)}.bkday.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}.bkday.full{opacity:.45}
.bkslots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.bkslot{border:1px solid var(--ink);background:var(--white);border-radius:12px;padding:10px 4px;font:500 14px Montserrat,sans-serif;letter-spacing:.08em;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px}.bkslot small{font-size:8.5px;letter-spacing:.06em;font-weight:400;color:var(--muted)}.bkslot.on{background:var(--ink);color:var(--cream)}.bkslot.on small{color:#d9d2cb}.bkslot:disabled{border-color:var(--line);color:#bdb5ae;cursor:default}
.chip{font:500 8.5px Montserrat,sans-serif;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--ink);border-radius:20px;padding:5px 9px;white-space:nowrap}.chip.confirmed{background:var(--ink);color:var(--cream)}.chip.rejected,.chip.expired,.chip.cancelled{border-color:var(--line);color:var(--muted)}.chip.awaiting_dp{border-color:#b0566a;color:#b0566a}
.paper .kv{padding:9px 0}.paper .kv .k{font-size:10px}
.igref{display:block;text-align:center;border:1px solid var(--ink);border-radius:30px;padding:10px 12px;margin-top:10px;font:500 10.5px Montserrat,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);text-decoration:none}
.bkcard.dim{opacity:.6}.agree{text-align:left;display:flex;gap:10px;align-items:flex-start;font-size:11.5px;line-height:1.5;color:var(--muted);margin-top:14px;text-transform:none;letter-spacing:0}.agree input{margin-top:3px;accent-color:var(--ink)}
.chatmode{display:flex;gap:6px;margin-top:18px;background:var(--white);border:1px solid var(--line);border-radius:30px;padding:4px}.chatmode button{flex:1;border:0;background:transparent;border-radius:24px;padding:10px;font:500 11px Montserrat,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);cursor:pointer}.chatmode button.on{background:var(--ink);color:var(--cream)}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--ink);color:var(--cream);overflow:hidden;flex:none;font-weight:500;letter-spacing:.04em}.av img{width:100%;height:100%;object-fit:cover;display:block}
.avbtn{position:relative;border:0;background:none;padding:0;cursor:pointer}.avcam{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--white);border:1px solid var(--line);font-size:12px;line-height:20px;color:var(--ink)}
.bkopt.bkart{flex-direction:row;align-items:center;gap:14px}.bkopt.bkart span{display:flex;flex-direction:column;gap:3px}
.lovenote .visits{color:#b0566a}
.since{text-align:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:14px}.since b{color:var(--ink);font-weight:500}
.ptrow{display:flex;gap:10px;flex-wrap:wrap}.pt{position:relative}.pti{width:64px;height:64px;border-radius:10px;border:1px solid var(--line);background:#f4f1ee center/cover no-repeat;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding:0;overflow:hidden}.pti span{font:500 8px Montserrat,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.45);width:100%;padding:4px 0}.pti.add{border-style:dashed;align-items:center}.pti.add span{background:none;color:var(--muted)}.ptx{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;border:0;background:#1b1b1b;color:#fff;font-size:13px;line-height:20px;padding:0;cursor:pointer}
.swx button{border:0;background:none;cursor:pointer;font:400 8.5px Montserrat,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0;text-align:center}
.swx i{display:block;width:34px;height:34px;border-radius:50%;margin:0 auto 4px;border:2px solid transparent;position:relative;overflow:hidden}
.swx i:after{content:"";position:absolute;right:3px;top:3px;width:9px;height:9px;border-radius:50%;background:var(--p)}
.swx button.on i{border-color:var(--ink)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--cream);font-size:11px;letter-spacing:.15em;padding:9px 16px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
.toast.on{opacity:1}
</style>
</head>

const DOS=[
{t:{id:'Sebelum Perawatan',en:'Before Your Treatment'},
 do:[{id:'Hadir sesuai jadwal yang sudah disepakati.',en:'Arrive at your agreed appointment time.'},{id:'Siapkan foto referensi beserta desain cadangan.',en:'Prepare reference photos along with a backup design.'},{id:'<b>Sempatkan ke toilet sebelum sesi dimulai.</b> Begitu proses dimulai, tanganmu sebaiknya tidak menyentuh apa pun supaya hasilnya tetap bersih dan rapi.',en:'<b>Use the restroom before we start.</b> Once the process begins, your hands should not touch anything so the result stays clean and neat.'},{id:'Lepaskan cincin, gelang, dan jam tangan (opsional, karena perhiasan bisa menghalangi proses dan terkena produk).',en:'Remove rings, bracelets and watches (optional, as jewelry can get in the way and come into contact with products).'}],
 dont:[{id:'<b>Memakai hand cream atau lotion di hari perawatan.</b> Lapisan minyaknya bisa membuat gel kurang menempel dan lebih cepat terangkat.',en:'<b>Using hand cream or lotion on the day of your treatment.</b> The oily layer can stop the gel from adhering and make it lift sooner.'},{id:'<b>Memotong kutikula sendiri.</b> Ini sangat memengaruhi hasil akhir, karena cara pemotongannya bisa berbeda dengan standar studio kami.',en:'<b>Cutting your own cuticles.</b> This strongly affects the final result, as your technique may differ from our studio standard.'}]},
{t:{id:'Selama Perawatan',en:'During Your Treatment'},
 do:[{id:'Duduk dengan nyaman, rileks, dan nikmati waktumu.',en:'Sit comfortably, relax and enjoy your time.'},{id:'Sampaikan arahanmu dengan leluasa, baik soal warna, bentuk, panjang, maupun detail desain. Nail artist kami akan senang mendengarnya dan melakukan yang terbaik untukmu.',en:'Feel free to share your wishes on color, shape, length or design details. Our nail artists are happy to hear them and will do their best for you.'},{id:'<b>Konfirmasikan desain sebelum pengerjaan dimulai.</b> Perubahan di tengah proses bisa memakan waktu lebih lama dan membuat lapisan menjadi tebal. <i>Penggantian warna atau desain setelah pengerjaan dimulai dikenakan biaya tambahan sesuai price list.</i>',en:'<b>Confirm your design before we begin.</b> Changes midway take longer and can make the layers thick. <i>Changing color or design after work has started is charged according to the price list.</i>'},{id:'<b>Sampaikan jika ada rasa tidak nyaman.</b> Rasa hangat di lampu UV itu wajar, tetapi jika terasa terlalu panas, perih, atau sakit, beri tahu kami. Nail artist kami akan langsung menyesuaikan.',en:'<b>Tell us if anything feels uncomfortable.</b> Warmth under the UV lamp is normal, but if it feels too hot, stings or hurts, let us know and your nail artist will adjust right away.'},{id:'<b>Posisikan jari dengan rata di dalam lampu UV sesuai arahan,</b> supaya gel mengering sempurna dan tidak meleber.',en:'<b>Place your fingers flat in the UV lamp as directed,</b> so the gel cures fully and does not run.'},{id:'Jika ada bagian yang kurang sesuai dengan harapanmu, jangan ragu untuk menyampaikannya. Kami justru senang mendengarnya.',en:'If anything is not quite what you hoped for, please tell us. We genuinely want to hear it.'}],
 dont:[{id:'<b>Memegang ponsel dengan tangan yang sedang dikerjakan.</b> Gerakan kecil saja bisa menggeser lapisan gel yang belum kering.',en:'<b>Holding your phone with the hand being worked on.</b> Even a small movement can shift gel that has not cured.'},{id:'<b>Menyentuh rambut, wajah, pakaian, atau tas sebelum selesai.</b> Debu, helai rambut, atau serat kain bisa menempel dan tertutup lapisan gel.',en:'<b>Touching your hair, face, clothes or bag before we finish.</b> Dust, hair or fabric fibers can stick and get sealed under the gel.'},{id:'<b>Menarik atau menggerakkan tangan secara tiba-tiba.</b> Hasil bisa menjadi tidak rapi, terutama saat pengikiran atau pengerjaan detail.',en:'<b>Pulling or moving your hand suddenly.</b> It can make the result untidy, especially during filing or detail work.'},{id:'<b>Mengecek kuku dengan menekan atau menyentuhnya</b> sebelum nail artist menyatakan selesai.',en:'<b>Checking your nails by pressing or touching them</b> before your nail artist says they are done.'}]},

const ckey=(bucket,path)=>location.origin+'/__ngdimg/'+bucket+'/'+path;
async function cacheGet(bucket,path){ try{ if(!window.caches)return null; const r=await (await caches.open(IMGCACHE)).match(ckey(bucket,path)); return r?await r.blob():null; }catch(_){return null} }
async function cachePut(bucket,path,blob){ try{ if(!window.caches)return; await (await caches.open(IMGCACHE)).put(ckey(bucket,path),new Response(blob,{headers:{'Content-Type':blob.type||'image/jpeg'}})); }catch(_){} }
async function cachedImage(bucket,path,seconds){
 let b=await cacheGet(bucket,path); if(b)return b;
 const r=await sb.storage.from(bucket).createSignedUrl(path,seconds||600); if(r.error||!r.data)return null;
 try{ b=await (await fetch(r.data.signedUrl)).blob(); await cachePut(bucket,path,b); return b; }catch(_){ return null; } }

async function squareJpeg(file,size){
 const url=URL.createObjectURL(file);
 try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
  const m=Math.min(img.naturalWidth,img.naturalHeight), cv=document.createElement('canvas'); cv.width=cv.height=size;
  const g=cv.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,size,size);
  g.drawImage(img,(img.naturalWidth-m)/2,(img.naturalHeight-m)/2,m,m,0,0,size,size);
  return await new Promise(res=>cv.toBlob(res,'image/jpeg',0.85));
 } finally { URL.revokeObjectURL(url); } }

function confirmSheet(title,body,yes,no,onYes,onNo){
 const w=document.createElement('div');
 w.style.cssText='position:fixed;inset:0;background:rgba(17,17,17,.4);display:flex;align-items:flex-end;justify-content:center;z-index:70';

 w.onclick=e=>{const a=e.target.dataset.a;if(!a&&e.target!==w)return;w.remove();if(a==='y')onYes();else if(a==='n')onNo&&onNo()};
 document.body.appendChild(w);
}

 if(e.target.closest('[data-bkfind]')){const n=$('#bkNote');if(n)BK.note=n.value;BK.step=3;bkLoadAvail();return}
 const bd=e.target.closest('[data-bkdate]'); if(bd){BK.date=bd.dataset.bkdate;BK.time=null;renderAcct();return}
 const bt=e.target.closest('[data-bktime]'); if(bt){BK.time=bt.dataset.bktime;renderAcct();setTimeout(()=>{const p=document.querySelector('.paper');if(p)p.scrollIntoView({behavior:'smooth',block:'center'})},50);return}
 if(e.target.id==='bkAgree'){BK.agree=e.target.checked;const n2=$('#bkNote2');if(n2)BK.note=n2.value;return}
 if(e.target.closest('[data-bkconfirm]')){const id=L==='id';
  if(!BK.agree)return toast(id?'Centang dulu persetujuan DP':'Please tick the DP agreement first');
  {const n2=$('#bkNote2');if(n2)BK.note=n2.value;}
  BK.busy=true;renderAcct();
  const r=await sb.rpc('ngd_client_book',{p_artist:BK.artist.id,p_date:BK.date,p_time:BK.time,p_services:BK.svc,p_note:BK.note||null});
  BK.busy=false;
  if(r.error){toast(r.error.message);bkLoadAvail();return}
  const bk=await sb.rpc('ngd_client_bookings'); BOOKINGS=bk.data||[]; BK.step=0; renderAcct(); window.scrollTo(0,0);
  toast(id?'Booking dibuat ♡ Transfer DP & upload buktinya ya':'Booking created ♡ Please transfer the DP and upload the proof');return}
 const bp=e.target.closest('[data-bkproof]'); if(bp){bkUploadProof(bp.dataset.bkproof);return}
 const cx=e.target.closest('[data-bkcx]'); if(cx){openCancel(cx.dataset.bkcx);return}
 const bx=e.target.closest('[data-bkcancel]'); if(bx){const id=L==='id';
  if(!confirm(id?'Batalkan booking ini? Kalau DP sudah ditransfer, DP tidak bisa dikembalikan.':'Cancel this booking? If you already paid the DP, it is non-refundable.'))return;
  const r=await sb.rpc('ngd_client_cancel_booking',{p_id:bx.dataset.bkcancel}); if(r.error)return toast(r.error.message);
  const bk=await sb.rpc('ngd_client_bookings'); BOOKINGS=bk.data||[]; renderAcct(); return}
 const lt=e.target.closest('[data-letter]'); if(lt){OPEN=lt.dataset.letter;const [mid,occ]=OPEN.split('|');const m=MSG.find(x=>x.id===mid&&x.occurrence===occ);if(m&&!m.read){m.read=true;sb.rpc('ngd_client_read_message',{p_message_id:mid,p_occurrence:occ});}renderAcct();return}
 if(e.target.closest('[data-close-letter]')){OPEN=null;renderAcct();return}
 if(e.target.id==='logout'){await sb.auth.signOut();LOGGED=false;ME=null;SUB='card';show('wifi');return}
 if(e.target.id==='setPin'){
  const a=$('#pin1').value,b=$('#pin2').value;
  if(!/^\d{6}$/.test(a))return toast(L==='id'?'PIN harus 6 angka':'PIN must be 6 digits');
  if(a!==b)return toast(L==='id'?'PIN tidak sama':'PINs do not match');
  const r=await sb.rpc('ngd_client_set_pin',{p_pin:a});
  if(r.error)return toast(r.error.message);
  await sb.auth.signInWithPassword({email:CLIENT_EMAIL(ME.username),password:a});
  toast(L==='id'?'PIN tersimpan':'PIN saved');
  await loadAccount();renderAcct();return;
 }
 const sn=e.target.closest('[data-setphnew]'); if(sn){pickSetPhoto(sn.dataset.setphnew,+sn.dataset.i);return}
 const sp=e.target.closest('[data-setph]'); if(sp){openCrop(sp.dataset.setph,+sp.dataset.i);return}
 const ra=e.target.closest('[data-achreq]'); if(ra){const k=ra.dataset.achreq; ACHOPEN=ACHOPEN===k?null:k; renderAcct(); return}
 const rs=e.target.closest('[data-achsend]'); if(rs){const k=rs.dataset.achsend, note=($('#achNote')||{}).value||'';
  rs.disabled=true; const r=await sb.rpc('ngd_client_request_achievement',{p_key:k,p_note:note}); rs.disabled=false;
  if(r.error)return toast(r.error.message); ME.ach_requests={...(ME.ach_requests||{}),[k]:{at:new Date().toISOString(),note}}; ACHOPEN=null;
  toast(L==='id'?'Terkirim ♡ Tim kami akan mengeceknya':'Sent ♡ Our team will check it'); renderAcct(); return}
 const rc=e.target.closest('[data-achcancel]'); if(rc){const k=rc.dataset.achcancel; const r=await sb.rpc('ngd_client_cancel_achievement',{p_key:k}); if(r.error)return toast(r.error.message);
  const q={...(ME.ach_requests||{})}; delete q[k]; ME.ach_requests=q; renderAcct(); return}
 const sd=e.target.closest('[data-setphdel]'); if(sd){const sid=sd.dataset.setphdel, x=SETS.find(y=>String(y.id)===String(sid)), o=SETOPT[sid]; if(x&&o){ if(!o.imgs)o.imgs=setImgs(x,o).slice(); o.imgs.splice(+sd.dataset.i,1); if(o.crop)o.crop.splice(+sd.dataset.i,1); refreshPh(sid);} return}
 const sf=e.target.closest('[data-setfont],[data-sethide],[data-settheme]');
 if(sf){const id=sf.dataset.setfont||sf.dataset.sethide||sf.dataset.settheme, o=SETOPT[id];
  const st=document.getElementById('story-'+id), rcp=st.querySelector('.rcp');
  if(sf.dataset.setfont){o.font=sf.dataset.v; rcp.classList.remove('mono','sans'); rcp.classList.add(o.font);}
  if(sf.dataset.sethide){o.hide=sf.dataset.v==='1'; rcp.querySelectorAll('.pv').forEach(p=>p.textContent=o.hide?'XXX':p.dataset.v);}
  if(sf.dataset.settheme){o.theme=+sf.dataset.v; st.setAttribute('style',themeVars(o.theme));}
  sf.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===sf));
  fitStories(); return}
 const dl=e.target.closest('[data-setdl]'); if(dl){downloadSet(dl.dataset.setdl);return}
 if(e.target.id==='bdaySave'){
  const v=$('#bdayIn').value; if(!v)return;
  const r=await sb.rpc('ngd_client_set_birthday',{p_date:v});
  if(r.error)return toast(r.error.message);
  ME.birthday=v;PROFILE.birthday=v;toast(L==='id'?'Ulang tahun tersimpan 🎂':'Birthday saved 🎂');renderAcct();return;
 }
 if(e.target.closest('[data-myphoto]')){pickMyPhoto();return}
 if(e.target.id==='pfSave'){ const id=L==='id', g=x=>($('#'+x)||{}).value||'';
  const bd=g('pfBday'), args={p_phone:g('pfPhone'),p_instagram:g('pfIg').trim().replace(/^@/,'').replace(/^https?:\/\/(www\.)?instagram\.com\//i,'').replace(/[\/?].*$/,''),p_area:g('pfArea'),p_referral:g('pfRef'),p_referral_detail:g('pfRefDetail'),p_allergy:g('pfAllergy'),p_birthday:bd||null};
  e.target.disabled=true; const r=await sb.rpc('ngd_client_save_profile',args);
  const fm=g('pfFirst'); let r2={}; if(fm&&!PROFILE.first_visit) r2=await sb.rpc('ngd_client_set_first_visit',{p_month:fm+'-01'});
  e.target.disabled=false;
  if(r.error)return toast(r.error.message); if(r2.error)return toast(r2.error.message);
  const pf=await sb.rpc('ngd_client_profile'); PROFILE=pf.data||PROFILE; if(PROFILE.birthday)ME.birthday=PROFILE.birthday;
  toast(id?'Profil tersimpan ♡':'Profile saved ♡'); renderAcct(); return; }
 const cm=e.target.closest('[data-chatmode]'); if(cm){CHATMODE=cm.dataset.chatmode;renderAcct();return}
 if(e.target.closest('[data-writelove]')){ if(!LOGGED){ toast(L==='id'?'Login dulu untuk menulis love note':'Log in first to write a love note'); show('login'); return } SUB='chat'; CHATMODE='love'; show('account'); renderAcct(); window.scrollTo(0,0); return }
 if(e.target.id==='loveSend'){
  const body=$('#loveBody').value.trim(); if(!body)return toast(L==='id'?'Tulis love note-mu dulu':'Write your love note first');
  const mode=(document.querySelector('input[name="loveMode"]:checked')||{}).value||'short';
  const r=await sb.rpc('ngd_client_post',{p_to:'Studio',p_body:body,p_allow_public:true,p_anonymous:mode==='initials',p_name_mode:mode});
  if(r.error)return toast(r.error.message);
  const p=await sb.rpc('ngd_client_posts'); POSTS=p.data||[]; toast(L==='id'?'Terima kasih ♡ Love note-mu akan dicek studio':'Thank you ♡ The studio will check your love note'); renderAcct(); return;
 }
 if(e.target.id==='postSend'){
  const body=$('#postBody').value.trim(); if(!body)return;
  const r=await sb.rpc('ngd_client_post',{p_to:$('#postTo').value,p_body:body,p_allow_public:$('#postPublic').checked,p_anonymous:$('#postPublic').checked&&$('#postAnon').checked,p_name_mode:$('#postPublic').checked&&$('#postAnon').checked?'initials':'short'});
  if(r.error)return toast(r.error.message);
  const p=await sb.rpc('ngd_client_posts'); POSTS=p.data||[]; toast(L==='id'?'Terkirim':'Sent'); renderAcct(); return;
 }
 if(e.target.dataset&&e.target.dataset.replypost){
  const id=e.target.dataset.replypost, inp=$('#rep-'+id), body=inp.value.trim(); if(!body)return;
  const r=await sb.rpc('ngd_client_reply',{p_post_id:id,p_body:body}); if(r.error)return toast(r.error.message);
  const p=await sb.rpc('ngd_client_posts'); POSTS=p.data||[]; renderAcct(); return;
 }
 if(e.target.dataset&&e.target.dataset.likereply){
  const r=await sb.rpc('ngd_client_like_reply',{p_reply_id:e.target.dataset.likereply}); if(r.error)return toast(r.error.message);
  const p=await sb.rpc('ngd_client_posts'); POSTS=p.data||[]; renderAcct(); return;
 }
 if(e.target.id==='saveNote'){
  const r=await sb.rpc('ngd_client_save_note',{p_note:$('#myNote').value});
  if(r.error)return toast(r.error.message);
  ME.client_note=$('#myNote').value;toast(L==='id'?'Catatan disimpan':'Notes saved');return;
 }
 if(e.target.id==='sendFb'){
  const id=L==='id',anon=$('#anon').checked,artist=$('#fbArtist').value,msg=$('#fbText').value.trim();
  if(!msg)return toast(id?'Tulis pesanmu dulu':'Write your message first');
  const send=async a=>{const r=await sb.rpc('ngd_client_feedback',{p_artist:artist,p_message:msg,p_anonymous:a});
   if(r.error)return toast(r.error.message);
   $('#fbText').value='';$('#anon').checked=false;toast(a?(id?'Terkirim sebagai anonim':'Sent anonymously'):(id?'Terkirim. Terima kasih!':'Sent. Thank you!'))};
  if(!anon||artist!=='Owner'){send(false);return}
  confirmSheet(id?'Kirim sebagai anonim?':'Send anonymously?',id?'Owner tidak akan tahu siapa pengirim masukan ini. Namamu tidak disimpan sama sekali.':'The Owner will not know who sent this. Your name is not stored at all.',id?'Ya, anonim':'Yes, anonymous',id?'Pakai nama saya':'Use my name',
   ()=>confirmSheet(id?'Yakin?':'Are you sure?',id?'Kalau Owner tahu siapa kamu, Owner bisa menindaklanjuti langsung dan memperbaiki pengalamanmu berikutnya. Masukanmu tetap hanya dibaca Owner.':'If the Owner knows who you are, she can follow up with you directly and make your next visit better. Your feedback is still read by the Owner only.',id?'Tetap anonim':'Stay anonymous',id?'Oke, pakai nama saya':'OK, use my name',()=>send(true),()=>send(false)),
   ()=>send(false));
 }
});
document.addEventListener('change',async e=>{
 if(e.target.id==='postPublic'){$('#anonPubRow').style.display=e.target.checked?'flex':'none';$('#pubHint').style.display=e.target.checked?'':'none';if(!e.target.checked)$('#postAnon').checked=false;return}
 if(e.target.dataset&&e.target.dataset.pubtoggle){const r=await sb.rpc('ngd_client_set_public',{p_post_id:e.target.dataset.pubtoggle,p_allow:e.target.checked});if(r.error)return toast(r.error.message);const p=await sb.rpc('ngd_client_posts');POSTS=p.data||[];renderAcct();return}
 if(e.target.id==='fbArtist'){const r=$('#anonRow');r.style.display=e.target.value==='Owner'?'flex':'none';if(e.target.value!=='Owner')$('#anon').checked=false}
});
$('#loginBtn').onclick=()=>show(LOGGED?'account':'login');
$('#doLogin').onclick=async()=>{
 const u=$('#u').value.trim(),p=$('#p').value.trim();
 if(!u||!p){toast(L==='id'?'Isi username dan PIN':'Enter your username and PIN');return}
 const btn=$('#doLogin');btn.disabled=true;
 const r=await sb.auth.signInWithPassword({email:CLIENT_EMAIL(u),password:p});
 btn.disabled=false;
 if(r.error){toast(/rate|many/i.test(r.error.message)?(L==='id'?'Terlalu banyak percobaan. Coba lagi nanti.':'Too many attempts. Try again later.'):(L==='id'?'Username atau PIN salah':'Wrong username or PIN'));return}
 $('#p').value='';
 if(await loadAccount()){SUB='card';show('account');}
};
sb.auth.getSession().then(async({data})=>{ if(data.session&&await loadAccount()){ if(VIEW==='login'||location.hash==='#account')show('account'); else render(); } });
loadPublic();

try{const s=localStorage.getItem('ng-lang');if(s)L=s}catch(_){}
render();show(location.hash.slice(1)||'wifi');
</script>
</body>
